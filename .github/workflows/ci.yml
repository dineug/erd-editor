name: ci

on:
  workflow_dispatch:
  # push is main-only and pull_request covers everything else, so a branch with
  # an open PR runs once. Dropping pull_request would leave a fork's push with no
  # checks here, and it is also what tests the merge commit against main.
  push:
    branches:
      - main
  pull_request:

# Superseding a PR run is free; cancelling a main run leaves the commit pushed
# first unverified, which is why this is an expression rather than true — and
# why intellij-plugin.yml, whose block is unconditional, is its own workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Style and types, the only place they are enforced for everyone: the
  # pre-commit hook's dispatcher is gitignored and written by pnpm install, so a
  # clone that never installed pushes unchecked code and nothing goes red.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # One pass over format and lint, both from the root vite.config.ts.
      - run: pnpm check
      # The typechecks below resolve their workspace dependencies through
      # emitted .d.ts, so something has to build them first. Pointing them at a
      # sibling's src/ would stop this gate ever seeing a broken declaration
      # emit, which is a live failure mode.
      - run: >-
          pnpm exec vp run
          --filter "@dineug/erd-editor-app..."
          --filter "vuerd-vscode..."
          --filter "!@dineug/erd-editor-app"
          --filter "!vuerd-vscode"
          --fail-if-no-match build
      # Both keep a typecheck script because each has a program its build task
      # does not cover: app's runs here for a clearer failure, and
      # vuerd-vscode's unit config widens to the vscode stub outside rootDir.
      - run: pnpm --filter @dineug/erd-editor-app typecheck
      - run: pnpm --filter vuerd-vscode typecheck
      # app's e2e specs and its playwright.config are outside the package
      # program, so this is the only thing that reads them.
      - run: pnpm --filter @dineug/erd-editor-app e2e:typecheck

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # erd-editor's browser-mode vitest project drives a real Chromium, so
      # pnpm test no longer runs without one. Same invocation as the e2e job
      # below, and the download is shared, so installing once here covers it.
      - name: Install Playwright browsers
        run: pnpm --filter @dineug/erd-editor exec playwright install --with-deps chromium
      - run: pnpm test
      # pnpm test does not enforce coverage. r-html sets perFile 80% on all four
      # metrics, and its CSS compiler is reached through one narrow seam, so a
      # whole rule class can stop being exercised without a test going red.
      - run: pnpm --filter @dineug/r-html test:coverage
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Install Playwright browsers
        run: pnpm --filter @dineug/erd-editor exec playwright install --with-deps chromium
      # The dev server resolves workspace deps to their dist/ and the e2e
      # typecheck reads their .d.ts, so both need this first. --fail-if-no-match
      # because a filter matching no package exits 0 and builds nothing.
      - run: pnpm exec vp run --fail-if-no-match --filter @dineug/erd-editor build
      - run: pnpm --filter @dineug/erd-editor e2e:typecheck
      - run: pnpm --filter @dineug/erd-editor e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/erd-editor/e2e/.report
          # The action skips anything under a dot-prefixed folder by default, so
          # the whole report is filtered out and a green run reports no files.
          include-hidden-files: true
          retention-days: 7

  # Its own job because it needs a browser download, and unlike the erd-editor
  # suite it needs no dist/ at all. It earns a CI slot because vCSSStyleSheet.ts
  # rests on two facts about a real engine happy-dom will never contradict.
  r-html-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Install Playwright browsers
        run: pnpm --filter @dineug/r-html exec playwright install --with-deps chromium
      # e2e/ is outside tsconfig.build.json's program, so nothing else ever
      # typechecks these files.
      - run: pnpm --filter @dineug/r-html e2e:typecheck
      - run: pnpm --filter @dineug/r-html e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: r-html-playwright-report
          path: packages/r-html/e2e/.report
          # Same trap as the erd-editor report: the action skips a dot-prefixed
          # folder unless told otherwise, and reports no files on a green run.
          include-hidden-files: true
          retention-days: 7

  vscode-extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # The Extension Host loads dist/extension.js, and buildHtmlForWebview
      # reads the public/index.html the webview package emits, so the extension
      # cannot activate until its own and its dependencies' builds have run.
      - run: pnpm exec vp run --fail-if-no-match --filter vuerd-vscode build
      # @vscode/test-cli launches a real Electron VSCode, which needs a display
      # even headless, and runs the whole matrix in .vscode-test.mjs. The env var
      # keeps its IPC socket under the unix path limit and the logs uploadable.
      - name: Run Extension Host tests
        run: xvfb-run -a pnpm --filter vuerd-vscode e2e
        env:
          VSCODE_TEST_USER_DATA_DIR: /tmp/vscode-test-user-data
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: vscode-extension-e2e-logs
          path: /tmp/vscode-test-user-data/*/logs
          retention-days: 7
