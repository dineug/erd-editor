name: ci

on:
  - workflow_dispatch
  - push
  - pull_request

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install
      - name: Install Playwright browsers
        run: pnpm --filter @dineug/erd-editor exec playwright install --with-deps chromium
      # The dev server resolves workspace deps to their `dist/`, and the e2e
      # typecheck reads their `.d.ts`, so both need this first. Nx caches it, so
      # the `e2e` target's own `dependsOn: ["^build"]` is a no-op after this.
      - run: pnpm exec nx build @dineug/erd-editor
      - run: pnpm --filter @dineug/erd-editor e2e:typecheck
      - run: pnpm exec nx run @dineug/erd-editor:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/erd-editor/e2e/.report
          # The action skips hidden paths by default, and that includes anything
          # inside a folder beginning with `.` — so the whole report is filtered
          # out and the upload reports "No files were found" on a green run.
          include-hidden-files: true
          retention-days: 7

  vscode-extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install
      # The Extension Host loads `main` (`dist/extension.js`), and
      # `Editor#buildHtmlForWebview` reads `public/index.html` emitted by
      # `@dineug/erd-editor-vscode-webview` — so the extension cannot activate
      # until its own build and its dependencies' builds have run.
      - run: pnpm exec nx build vuerd-vscode
      # `@vscode/test-cli` launches a real (Electron) VSCode, which needs a
      # display even in `--disable-gpu` headless CI. This runs the whole matrix
      # in `.vscode-test.mjs` — stable plus the `engines.vscode` floor — so it
      # downloads two VSCode builds. `VSCODE_TEST_USER_DATA_DIR` is the base each
      # version's profile hangs off; it keeps VSCode's IPC socket well under the
      # unix socket path limit and puts the logs somewhere this job can upload.
      - name: Run Extension Host tests
        run: xvfb-run -a pnpm exec nx run vuerd-vscode:e2e
        env:
          VSCODE_TEST_USER_DATA_DIR: /tmp/vscode-test-user-data
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: vscode-extension-e2e-logs
          path: /tmp/vscode-test-user-data/*/logs
          retention-days: 7
