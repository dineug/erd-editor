name: ci

on:
  - workflow_dispatch
  - push
  - pull_request

jobs:
  # Style and types. This is the only place they are enforced for everyone: the
  # `pre-commit` hook runs the same checks, but its dispatcher lives in
  # gitignored `.vite-hooks/_/` and is written by `pnpm install`, so a clone
  # that has never installed pushes unchecked code and nothing goes red.
  #
  # It was added deliberately *before* the toolchain migration rather than
  # alongside it. The commits that followed replaced eslint, prettier, husky,
  # lint-staged and Nx wholesale, and swapping the tools that guard a repo while
  # nothing guards them is how a rule silently stops being enforced. Having this
  # job green beforehand is what made the swap observable — it had to stay green
  # through every step, and it did.
  #
  # `vp check` reports rather than rewrites; `pnpm format` is the writing half.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # One pass over format and lint, both from the root `vite.config.ts`.
      # Replaces `pnpm lint` + `prettier --check`; the job was green with those
      # and has to stay green with this, which is the point of adding it first.
      - run: pnpm check
      # `app` and `vuerd-vscode` keep a `typecheck` script because each has a
      # program its `build` task does not cover — `app`'s is the same one, run
      # here for a clearer failure, and `vuerd-vscode`'s `tsconfig.unit.json`
      # widens to the `vscode` stub outside `rootDir`.
      - run: pnpm --filter @dineug/erd-editor-app typecheck
      - run: pnpm --filter vuerd-vscode typecheck
      # `app`'s e2e specs and its playwright.config are outside the package
      # tsconfig's program, so this is the only thing that reads them. The
      # erd-editor and r-html equivalents already run in their own e2e jobs.
      - run: pnpm --filter @dineug/erd-editor-app e2e:typecheck

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test
      # `pnpm test` does not enforce coverage. r-html's `vitest.config.ts` sets
      # `perFile: true` at 80% on all four metrics, and the CSS compiler under
      # `src/css/` is reached from `css``` through one narrow seam — a whole
      # rule class can stop being exercised without a single test going red.
      - run: pnpm --filter @dineug/r-html test:coverage
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Install Playwright browsers
        run: pnpm --filter @dineug/erd-editor exec playwright install --with-deps chromium
      # The dev server resolves workspace deps to their `dist/`, and the e2e
      # typecheck reads their `.d.ts`, so both need this first. The `e2e` script
      # builds them too; Vite Task replays that from cache rather than rebuilding.
      # `--fail-if-no-match` because a filter that matches no package exits 0 and
      # prints a line nobody reads. Rename or move this package and the job stays
      # green while building nothing. A missing *task* name already exits 1.
      - run: pnpm exec vp run --fail-if-no-match --filter @dineug/erd-editor build
      - run: pnpm --filter @dineug/erd-editor e2e:typecheck
      - run: pnpm --filter @dineug/erd-editor e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/erd-editor/e2e/.report
          # The action skips hidden paths by default, and that includes anything
          # inside a folder beginning with `.` — so the whole report is filtered
          # out and the upload reports "No files were found" on a green run.
          include-hidden-files: true
          retention-days: 7

  # Its own job rather than a few extra steps on `e2e`, for the same reason
  # `e2e` is not part of `ci`: it needs a browser download. Keeping it separate
  # also keeps it fast — unlike the erd-editor suite this one needs no `dist/`
  # at all (the Vite dev server serves r-html's own `src/` through the `@`
  # alias), so folding it in would park a build-free suite behind
  # `vp run --filter @dineug/erd-editor build`.
  #
  # It earns a CI slot because `src/template/vCSSStyleSheet.ts` is built on two
  # facts about a real engine that no unit test can see: `adoptedStyleSheets` is
  # mutable in place, and a permuted sheet list is only re-resolved if something
  # dirties a rule set the affected elements match. happy-dom has no style engine
  # and will keep agreeing with us whatever Chromium does.
  r-html-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Install Playwright browsers
        run: pnpm --filter @dineug/r-html exec playwright install --with-deps chromium
      # `e2e/` is outside `tsconfig.build.json`'s program, so nothing else ever
      # typechecks these files.
      - run: pnpm --filter @dineug/r-html e2e:typecheck
      - run: pnpm --filter @dineug/r-html e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: r-html-playwright-report
          path: packages/r-html/e2e/.report
          # Same trap as the erd-editor report: the action skips anything under a
          # dot-prefixed folder unless told otherwise, and reports "No files were
          # found" on a green run.
          include-hidden-files: true
          retention-days: 7

  vscode-extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # The Extension Host loads `main` (`dist/extension.js`), and
      # `Editor#buildHtmlForWebview` reads `public/index.html` emitted by
      # `@dineug/erd-editor-vscode-webview` — so the extension cannot activate
      # until its own build and its dependencies' builds have run.
      - run: pnpm exec vp run --fail-if-no-match --filter vuerd-vscode build
      # `@vscode/test-cli` launches a real (Electron) VSCode, which needs a
      # display even in `--disable-gpu` headless CI. This runs the whole matrix
      # in `.vscode-test.mjs` — stable plus the `engines.vscode` floor — so it
      # downloads two VSCode builds. `VSCODE_TEST_USER_DATA_DIR` is the base each
      # version's profile hangs off; it keeps VSCode's IPC socket well under the
      # unix socket path limit and puts the logs somewhere this job can upload.
      - name: Run Extension Host tests
        run: xvfb-run -a pnpm --filter vuerd-vscode e2e
        env:
          VSCODE_TEST_USER_DATA_DIR: /tmp/vscode-test-user-data
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: vscode-extension-e2e-logs
          path: /tmp/vscode-test-user-data/*/logs
          retention-days: 7
