# The Kotlin/Gradle half of the IntelliJ plugin, its own file because the
# concurrency block below is workflow-level and folding it into ci.yml would
# start cancelling those five jobs on consecutive pushes to main.
name: intellij-plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Always runs, always green. The jobs below gate on its output rather than a
  # workflow-level paths filter, because a workflow skipped by paths leaves its
  # checks Pending forever while a skipped job counts as passing.
  gate:
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            plugin:
              - 'packages/intellij-plugin/**'
              - 'packages/intellij-webview/**'
              - 'packages/agent-hub/**'
              - 'packages/agent-hub-host/**'
              - 'packages/mcp-server/**'
              - 'packages/webview-bridge/**'
              - '.github/workflows/intellij-plugin.yml'
              - '.github/actions/setup-workspace/**'

  # The four packages after the webview feed the Kotlin tests: corpora, theme
  # lists, the MCP. Every other upstream package stays out: pnpm build in ci.yml
  # fails on a broken webview bundle, and mcp-server's tests on a broken MCP.
  build:
    needs: gate
    # The two fallback clauses are the safety net: a gate that misreads the diff
    # can only cost a run here, never skip one on main or an explicit dispatch.
    if: >-
      needs.gate.outputs.plugin == 'true'
      || github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace

      # buildPlugin packages src/main/resources/assets, which is gitignored and
      # produced here. verifyWebviewAssets turns an absent bundle into a build
      # failure rather than a plugin that opens a blank editor.
      - run: pnpm exec vp run --filter @dineug/erd-editor-intellij-webview --fail-if-no-match build
      # The conformance run starts this build with node against a Kotlin hub.
      - run: pnpm exec vp run --filter @dineug/erd-editor-mcp --fail-if-no-match build

      # javaVersion in packages/intellij-plugin/gradle.properties. The plugin is
      # compiled against the oldest JDK it must load on.
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # check is the JVM unit tests, the conformance run and the Kover report
      # with its per-class gate on the hub core. Without ERD_MCP_CONFORMANCE a
      # missing MCP build only skips the conformance run; here it fails it.
      - run: ./gradlew check buildPlugin
        working-directory: packages/intellij-plugin
        env:
          ERD_MCP_CONFORMANCE: required

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: intellij-plugin-test-report
          path: packages/intellij-plugin/build/reports/tests/test
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin-distribution
          path: packages/intellij-plugin/build/distributions/*.zip
          retention-days: 7

      # The MCP is one ESM file with nothing external but node builtins, so
      # test-windows runs this copy with no workspace. Kept one day: after that,
      # re-run all jobs, as test-windows alone can no longer download it.
      - uses: actions/upload-artifact@v7
        with:
          name: erd-editor-mcp
          path: packages/mcp-server/dist/erd-editor-mcp.js
          retention-days: 1

  # The Kotlin named-pipe hub, its Windows realpath and liveness, and the
  # conformance run over the pipe execute only here. test, not check: check adds
  # only Kover, whose gate build.gradle.kts turns off on Windows.
  test-windows:
    needs: [gate, build]
    if: >-
      needs.gate.outputs.plugin == 'true'
      || github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Node without pnpm: the tests only start node, and the MCP they start it
      # on comes from build, into the path build.gradle.kts hands them.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: erd-editor-mcp
          path: packages/mcp-server/dist

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      # Only build writes the Gradle cache, as in JetBrains' plugin template: a
      # copy of the IDE per job, packed and unpacked, ran past GitHub's 10 GB. A
      # Windows job reads no Linux entry, so this one downloads the IDE each run.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # gradlew.bat: the runner checks gradlew out with CRLF, as no .gitattributes
      # keeps its LF. Gradle writes no report of a run the bound stops, so the init
      # script logs each test as it starts and ends: the log shows where it hung.
      - run: |
          $events = "$env:RUNNER_TEMP\test-events.gradle"
          Set-Content $events "allprojects { tasks.withType(Test).configureEach { testLogging.events('started', 'passed', 'skipped', 'failed') } }"
          .\gradlew.bat test --init-script $events
        working-directory: packages/intellij-plugin
        timeout-minutes: 45
        env:
          ERD_MCP_CONFORMANCE: required

      # A suite that skipped still passes, so each of the four that run nowhere
      # else must leave one report that ran tests and skipped none, as the plugin's
      # AGENTS.md asks of a Windows run.
      - run: |
          for suite in NamedPipeTransportTest WindowsRealPathTest WindowsMachineTest McpConformanceTest; do
            reports=(build/test-results/test/TEST-*."$suite".xml)
            if [ "${#reports[@]}" -ne 1 ] || [ ! -f "${reports[0]}" ] ||
              ! grep -Eq '<testsuite [^>]*tests="[1-9][0-9]*" skipped="0"' "${reports[0]}"; then
              echo "::error::$suite left no single report that ran and skipped none"
              exit 1
            fi
          done
        shell: bash
        working-directory: packages/intellij-plugin

      # The XML results too: they are what the check above reads.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: intellij-plugin-test-report-windows
          path: |
            packages/intellij-plugin/build/reports/tests/test
            packages/intellij-plugin/build/test-results/test
          retention-days: 7

  # The IntelliJ Plugin Verifier downloads a full IDEA distribution per IDE in
  # the range, which is why it is not on every pull request. Releases are manual,
  # so main and workflow_dispatch are the two moments the answer is needed.
  verify:
    needs: [gate, build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # Unpacking a unified IntelliJ IDEA install exhausts a stock runner.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # The Verifier inspects the assembled plugin, so the bundle has to exist here too.
      - run: pnpm exec vp run --filter @dineug/erd-editor-intellij-webview --fail-if-no-match build

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      # Read only, as test-windows: the IDEs of the range arrive through Gradle,
      # unpacked into its transforms, which this job wrote as one 4.5 GB entry,
      # so each run downloads them, as the template's verify job does.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - run: ./gradlew verifyPlugin
        working-directory: packages/intellij-plugin

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: intellij-plugin-verifier-result
          path: packages/intellij-plugin/build/reports/pluginVerifier
          retention-days: 7
