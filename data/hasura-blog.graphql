# hasura-blog -- the SDL a Hasura GraphQL Engine serves for a seven-table blog
# schema, in the shape `gq dump-schema` / an introspection export produces it:
# snake_case table types, Postgres scalar names, and one generated family of
# aggregate, filter, ordering and mutation-response types per table.
#
# Only the seven table types below should reach the canvas. Everything else --
# the roots named by the `schema` block, `*_aggregate`, `*_aggregate_fields`,
# `*_max_fields` and friends, `*_mutation_response`, and every `*_bool_exp` /
# `*_order_by` / `*_insert_input` / `*_on_conflict` input -- is API surface
# rather than storage, and is what the pruning path has to drop.
#
# The relationship columns are real columns here (`author_id`, `post_id`,
# `parent_id`), so the importer binds each relationship onto the column that is
# already there rather than inventing a second one beside it.

schema {
  query: query_root
  mutation: mutation_root
  subscription: subscription_root
}

scalar bigint

scalar date

scalar float8

scalar jsonb

scalar numeric

scalar timestamptz

scalar uuid

"""
ordering argument of a cursor
"""
enum cursor_ordering {
  ASC
  DESC
}

"""
column ordering options
"""
enum order_by {
  asc
  asc_nulls_first
  asc_nulls_last
  desc
  desc_nulls_first
  desc_nulls_last
}

"""
Boolean expression to compare columns of type "String". All fields are combined with logical 'AND'.
"""
input String_comparison_exp {
  _eq: String
  _gt: String
  _ilike: String
  _in: [String!]
  _is_null: Boolean
  _like: String
  _lt: String
  _neq: String
  _nlike: String
}

"""
Boolean expression to compare columns of type "uuid". All fields are combined with logical 'AND'.
"""
input uuid_comparison_exp {
  _eq: uuid
  _gt: uuid
  _in: [uuid!]
  _is_null: Boolean
  _lt: uuid
  _neq: uuid
}

