type query_root {
  categories(
    distinct_on: [categories_select_column!]
    limit: Int
    offset: Int
  ): [categories!]!
  categories_aggregate(limit: Int, offset: Int): categories_aggregate!
  comments(
    distinct_on: [comments_select_column!]
    limit: Int
    offset: Int
    order_by: [comments_order_by!]
    where: comments_bool_exp
  ): [comments!]!
  comments_aggregate(where: comments_bool_exp): comments_aggregate!
  comments_by_pk(id: uuid!): comments
  posts(
    distinct_on: [posts_select_column!]
    limit: Int
    offset: Int
    order_by: [posts_order_by!]
    where: posts_bool_exp
  ): [posts!]!
  posts_aggregate(where: posts_bool_exp): posts_aggregate!
  posts_by_pk(id: uuid!): posts
  profiles(limit: Int, offset: Int): [profiles!]!
  tags(limit: Int, offset: Int): [tags!]!
  users(where: users_bool_exp, limit: Int, offset: Int): [users!]!
  users_aggregate(where: users_bool_exp): users_aggregate!
  users_by_pk(id: uuid!): users
}

type mutation_root {
  delete_comments(where: comments_bool_exp!): comments_mutation_response
  delete_posts_by_pk(id: uuid!): posts
  insert_comments(
    objects: [comments_insert_input!]!
    on_conflict: comments_on_conflict
  ): comments_mutation_response
  insert_posts(
    objects: [posts_insert_input!]!
    on_conflict: posts_on_conflict
  ): posts_mutation_response
  update_comments(
    _set: comments_set_input
    where: comments_bool_exp!
  ): comments_mutation_response
  update_posts(
    _set: posts_set_input
    where: posts_bool_exp!
  ): posts_mutation_response
  update_users_by_pk(id: uuid!): users
}

type subscription_root {
  comments(
    distinct_on: [comments_select_column!]
    limit: Int
    offset: Int
    order_by: [comments_order_by!]
    where: comments_bool_exp
  ): [comments!]!
  posts(
    distinct_on: [posts_select_column!]
    limit: Int
    offset: Int
    order_by: [posts_order_by!]
    where: posts_bool_exp
  ): [posts!]!
  posts_by_pk(id: uuid!): posts
}
