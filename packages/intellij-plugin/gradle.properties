# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.github.dineug.erdeditorintellijplugin
pluginName = erd-editor-intellij-plugin
pluginRepositoryUrl = https://github.com/dineug/erd-editor-intellij-plugin
# SemVer format -> https://semver.org
pluginVersion = 0.2.1

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# 252 = 2025.2. untilBuild is intentionally left open (see build.gradle.kts).
pluginSinceBuild = 252

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-intellij-platform-gradle-plugin.html
# The separate IntelliJ IDEA Community (IC) distribution was discontinued after 2025.2;
# 2025.3 and later ship as a single unified IntelliJ IDEA distribution.
platformVersion = 2026.1.4

# Java version used to compile the plugin. 2026.1 requires Java 21;
# 2026.2 requires Java 25 but stays binary compatible with Java 21 plugins.
javaVersion = 21

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.1.0

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
