    <title>r-html e2e fixture</title>

  <!--
    No <style> block and no stylesheet link: the whole point of the page is that
    every rule a host sees arrives through `adoptedStyleSheets`, so the document
    contributes nothing to the cascade beyond the UA sheet. Layout that the page
    itself needs lives in style attributes.
  -->
  <body style="margin: 0; padding: 0">
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
