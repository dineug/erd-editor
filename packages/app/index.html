<!doctype html>
<html class="dark-theme" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <script>
      // Pre-paint: the markup defaults to dark for no-JS. A stored light or
      // system preference is applied here, before first paint, with the rules
      // of parseThemeState and resolveAppearance in src/utils/theme.ts.
      (function () {
        try {
          var appearance = JSON.parse(localStorage.getItem('@theme')).appearance;
          if (appearance === 'system') {
            appearance = matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          if (appearance === 'light') {
            var root = document.documentElement;
            root.classList.remove('dark-theme');
            root.classList.add('light-theme');
            root.style.colorScheme = 'light';
          }
        } catch (error) {}
      })();
    </script>
    <title>ERD Editor</title>
    <meta name="description" content="Entity-Relationship Diagram Editor App" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link
      rel="icon"
      href="/erd-editor_icon.svg"
      sizes="any"
      type="image/svg+xml"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- The static links a policy check that runs no script finds on /. -->
    <noscript>
      <p style="margin: 16px; font-family: system-ui, sans-serif">
        ERD Editor needs JavaScript.
        <a href="/privacy">Privacy Policy</a> ·
        <a href="/terms">Terms of Service</a>
      </p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
