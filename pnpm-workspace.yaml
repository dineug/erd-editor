packages:
  - 'packages/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vitest: 4.1.10
  vite-plus: 0.2.9
  '@vitest/browser-playwright': 4.1.10
  '@vitest/coverage-v8': 4.1.10
  effect: 4.0.0-rc.117
  '@effect/platform-node': 4.0.0-rc.117
overrides:
  # Was `resolutions` in the root package.json, which pnpm reads but does not
  # document; this is the field it actually specifies for the job.
  typescript: 7.0.2
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
packageExtensions:
  # redis backs only platform-node's Redis layers, which nothing here imports.
  # Left required, auto-install-peers would lock redis, five @redis/* packages
  # and cluster-key-slot.
  '@effect/platform-node':
    peerDependenciesMeta:
      redis:
        optional: true
