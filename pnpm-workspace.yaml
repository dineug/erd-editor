packages:
  - 'packages/*'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
  '@vitest/browser-playwright': 5.0.1
  '@vitest/coverage-v8': 5.0.1
  effect: 4.0.0
  '@effect/platform-node': 4.0.0
  # Every other version two or more manifests share. pnpm publish writes each
  # back as its range, so an npm package's manifest never names the catalog;
  # vsce ships vuerd-vscode's as it is, which names it in devDependencies alone.
  typescript: 7.0.2
  '@typescript/typescript6': 6.0.2
  vite-plugin-dts: '^5.0.3'
  '@types/node': '^22.20.1'
  happy-dom: '^20.11.2'
  '@playwright/test': '^1.62.1'
  konva: '^10.3.2'
  es-toolkit: '^1.50.0'
  comlink: '^4.4.2'
  '@chenglou/pretext': '^1.0.0'
  core-js: '^3.51.0'
  stylis: '^4.4.0'
  ws: '^8.18.3'
overrides:
  # Was `resolutions` in the root package.json, which pnpm reads but does not
  # document; this is the field it actually specifies for the job.
  typescript: 'catalog:'
  # Bare keys, not the vite@* / vitest@* vp migrate writes: a range key skips
  # non-semver specs, among them vite-plus's own npm: alias for vite, so only a
  # bare key keeps one vite-plus-core however the catalog moves.
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
    # Storybook's optional peer stops at vite-plus 0.2, but all it reads is
    # vite-plus/versions, which 1.0 still exports; build:storybook passes on it.
    storybook>vite-plus: '1'
    # unplugin-dts names @rspack/core ^1 as an optional peer for its Rspack
    # plugin's types alone: none of its modules imports Rspack, whether
    # vite-plugin-dts loads its root or its Vite entry. The root's Rspack 2,
    # which pnpm consumer-bundles bundles with, answers that peer in every
    # package that builds declarations.
    unplugin-dts>@rspack/core: '2'
packageExtensions:
  # redis backs only platform-node's Redis layers, which nothing here imports.
  # Left required, auto-install-peers would lock redis, five @redis/* packages
  # and cluster-key-slot.
  '@effect/platform-node':
    peerDependenciesMeta:
      redis:
        optional: true
